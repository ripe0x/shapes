name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changed paths
    runs-on: ubuntu-latest
    outputs:
      contracts: ${{ steps.filter.outputs.contracts }}
      renderer: ${{ steps.filter.outputs.renderer }}
      site: ${{ steps.filter.outputs.site }}
      indexer: ${{ steps.filter.outputs.indexer }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            contracts:
              - 'src/**'
              - 'test/**'
              - 'medusa/**'
              - 'script/**'
              - 'lib/**'
              - 'project/experiments/medusa-reserve.json'
              - 'foundry.toml'
              - 'remappings.txt'
              - '.github/workflows/ci.yml'
            renderer:
              - 'src/**'
              - 'lib/**'
              - 'preview/**'
              - 'test/fixtures/**'
              - 'package.json'
              - 'package-lock.json'
              - 'foundry.toml'
              - 'remappings.txt'
              - '.github/workflows/ci.yml'
            site:
              - 'preview/**'
              - 'web/**'
              - 'netlify.toml'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
            indexer:
              - 'indexer/**'
              - '.github/workflows/ci.yml'

  contracts:
    name: contracts
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
          cache: true

      # compiled artifacts (out/, cache/), keyed on everything solc reads. A cache hit turns
      # forge build into a no-op instead of a full recompile.
      - uses: actions/cache@v4
        with:
          path: |
            out
            cache
          key: forge-build-${{ runner.os }}-${{ hashFiles('src/**/*.sol', 'lib/**/*.sol', 'test/**/*.sol', 'script/**/*.sol', 'foundry.toml', 'remappings.txt') }}
          restore-keys: |
            forge-build-${{ runner.os }}-

      # forge build --sizes exits nonzero if any deployable contract exceeds the EIP-170
      # runtime size limit (24,576 bytes), so this step doubles as the CI size gate.
      - name: build
        run: forge build --sizes

      # heavier fuzzing and invariant depth than the local default
      - name: test
        run: FOUNDRY_PROFILE=ci forge test -vv

  deploy-anvil:
    name: deploy (anvil) + lifecycle
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
          cache: true

      - uses: actions/cache@v4
        with:
          path: |
            out
            cache
          key: forge-build-${{ runner.os }}-${{ hashFiles('src/**/*.sol', 'lib/**/*.sol', 'test/**/*.sol', 'script/**/*.sol', 'foundry.toml', 'remappings.txt') }}
          restore-keys: |
            forge-build-${{ runner.os }}-

      # The lifecycle walkthrough runs the indexer against the same chain.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: indexer/package-lock.json

      - name: install indexer
        run: npm ci --prefix indexer --no-audit --no-fund

      # script/deploy.sh and script/lifecycle.sh both expect a chain already answering on
      # 127.0.0.1:8545; this job owns starting and stopping it. The gas limit is raised because
      # the lifecycle's apex Complete is folded from 10000 origins in a handful of transactions.
      - name: start anvil
        run: |
          anvil --port 8545 --gas-limit 5000000000 >/tmp/anvil.log 2>&1 &
          for _ in $(seq 1 50); do
            cast block-number --rpc-url http://127.0.0.1:8545 >/dev/null 2>&1 && exit 0
            sleep 0.2
          done
          echo "anvil never came up"; cat /tmp/anvil.log; exit 1

      - name: deploy (script/deploy.sh anvil)
        run: script/deploy.sh anvil

      - name: lifecycle (script/lifecycle.sh anvil)
        run: script/lifecycle.sh anvil

      - name: stop anvil
        if: always()
        run: pkill -f 'anvil --port 8545' || true

  renderer:
    name: renderer parity
    needs: changes
    if: needs.changes.outputs.renderer == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
          cache: true

      - uses: actions/cache@v4
        with:
          path: |
            out
            cache
          key: forge-build-${{ runner.os }}-${{ hashFiles('src/**/*.sol', 'lib/**/*.sol', 'test/**/*.sol', 'script/**/*.sol', 'foundry.toml', 'remappings.txt') }}
          restore-keys: |
            forge-build-${{ runner.os }}-

      # The lockfile lives at the repo root (npm workspaces: web + preview), so
      # install runs there; preview's deps hoist into the root node_modules.
      - name: install
        run: npm ci

      - name: typecheck
        working-directory: preview
        run: npx tsc --noEmit

      # PRNG fidelity against the Round 03 source, and exact cell containment
      - name: verify
        working-directory: preview
        run: npm run verify

      # 500 samples per denomination; prints the composition space per band
      - name: collision sweep
        working-directory: preview
        run: npm run sweep

      # Regenerating the fixtures must be a no-op. If this diff is non-empty the
      # committed corpus has drifted from the canonical TypeScript renderer.
      - name: fixtures are current
        working-directory: preview
        run: |
          npm run fixtures
          SHAPES_LADDER=testnet npm run fixtures
          git diff --exit-code -- ../test/fixtures/fixtures.mainnet.json ../test/fixtures/fixtures.testnet.json

      # The /contracts page is generated from the artifacts. Regenerating must be a no-op; a
      # non-empty diff means an ABI or NatSpec change landed without the committed docs.
      - name: contract docs are current
        working-directory: preview
        run: npm run contracts:docs:check

      # and the Solidity port must still match them byte for byte
      - name: byte parity
        run: |
          forge test --mc ParityTest -vv
          FOUNDRY_PROFILE=testnet forge test --mc ParityTest -vv

  indexer:
    name: indexer
    needs: changes
    if: needs.changes.outputs.indexer == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: indexer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: indexer/package-lock.json

      - name: install
        run: npm ci

      - name: audit production dependencies
        run: npm audit --omit=dev

      - name: test
        run: npm test

      - name: codegen
        run: npm run codegen

      - name: typecheck
        run: npm run typecheck

      - name: build deployment image
        run: docker build --tag shapes-indexer:ci .

  site:
    name: site
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: install
        run: npm ci

      - name: test shared site logic
        run: npm run test --workspace preview

      - name: lint
        run: npm run lint --workspace web

      - name: build
        run: npm run build --workspace web

  medusa:
    name: medusa reserve lifecycle
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: install bounded fuzzing toolchain
        run: |
          python -m pip install --disable-pip-version-check crytic-compile==0.3.11
          curl -fsSLo "$RUNNER_TEMP/medusa-linux-x64.tar.gz" https://github.com/crytic/medusa/releases/download/v1.5.1/medusa-linux-x64.tar.gz
          echo "ddfe1517ae9028ef9fc331b00f5a6a9d5406f3fcd11a715d60c6b6fb3e4546d3  $RUNNER_TEMP/medusa-linux-x64.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/medusa-bin"
          tar -xzf "$RUNNER_TEMP/medusa-linux-x64.tar.gz" -C "$RUNNER_TEMP/medusa-bin"
          echo "$RUNNER_TEMP/medusa-bin" >> "$GITHUB_PATH"

      # script/medusa.sh writes a root-level config with an absolute target; see its header.
      - name: fuzz reserve and lifecycle invariants
        run: ./script/medusa.sh
