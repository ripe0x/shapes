app = "shapes-indexer"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "42069"
  PONDER_LOG_LEVEL = "info"
  PONDER_MAX_THREADS = "1"
  PONDER_CHAIN_ID = "11155111"
  PONDER_RPC_URL = "https://gateway.tenderly.co/public/sepolia"
  PONDER_RPC_FALLBACKS = "https://ethereum-sepolia-rpc.publicnode.com"
  PONDER_POLL_INTERVAL_MS = "12000"
  PONDER_DATABASE_DIR = "/data/pglite"
  DATABASE_SCHEMA = "shapes_sepolia_v9"
  SHAPES_LADDER = "testnet"
  SHAPES_ADDRESS = "0x6c2f9c00f44fbbf141dd166979903004b80d5f99"
  AUCTION_HOUSE_ADDRESS = "0xf3f72672330f827549e57f71520b9de145c86435"
  SHAPES_START_BLOCK = "11628203"

[[mounts]]
  source = "shapes_indexer_data"
  destination = "/data"

[http_service]
  internal_port = 42069
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 30
    soft_limit = 15

  [[http_service.checks]]
    interval = "30s"
    timeout = "10s"
    grace_period = "60s"
    method = "GET"
    path = "/health"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
