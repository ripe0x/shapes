[profile.default]
# The mainnet denomination ladder. `FOUNDRY_PROFILE=testnet` swaps in the 100x-smaller one;
# see src/lib/Denominations.sol.
remappings = ["ladder/=ladders/mainnet/"]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
# Restored to 100 (issue #21, follow-up to #21B) after `Shapes`'s own runtime bytecode was cut:
# `positionOf`, `exists`, `isSupportedDenomination`, `gridForAmount` and `modulesForAmount` moved
# to `ShapeLens` (none of them touch mint/redeem/compose/split/decompose accounting), plus
# consolidating a handful of repeated admin-lock and revert checks into shared private helpers.
# `denominationAt`, `denominationCount`, `unit`, `childSeed`, `formationOf` and `isComplete`
# stayed on `Shapes`: a review (issue #21A) found the first pass had also moved them, which left
# `supportsInterface` advertising `IShapeValue`/`IShapeProvenance` (SPEC.md's stable capability
# interfaces) with members that no longer existed on the token, so they came back. At 100,
# `Shapes`'s own runtime size is 24,010 bytes: a 566-byte margin under the EIP-170 24,576 limit.
# 200 was tried and does not fit: runtime size rises with `optimizer_runs` (more inlining trades
# size for gas), reaching a 258-byte margin at 200 and a 420-byte margin at 150, both still under
# the limit but with less room than 100 leaves for issue #21C's upcoming trait bytecode. Re-measure
# with `forge build --sizes` before changing this value in either direction.
optimizer_runs = 100
via_ir = true
bytecode_hash = "none"
cbor_metadata = false
fs_permissions = [{ access = "read", path = "./test/fixtures" }]
gas_reports = ["Shapes", "ShapeRenderer"]
# Reversible compose writes a per-input record, so building a 10,000-origin apex Complete in the
# test fixtures (a single large compose) exceeds forge's 2^30 default. These are logic tests run in
# an inflated-gas environment; mainnet feasibility is a client concern (batch composes to the live
# block gas limit), not a contract limit. See DECOMPOSE_SPEC.md.
gas_limit = "18446744073709551615"
block_gas_limit = 30_000_000_000

# Builds and tests against the 100x-smaller ladder, which is what public testnet deploys use.
# Inherits every other setting from the default profile.
[profile.testnet]
remappings = ["ladder/=ladders/testnet/"]
# Separate artifact and cache directories. Sharing the default profile's would let a build resolve
# `ladder/` to one table and then reuse artifacts compiled against the other.
out = "out-testnet"
cache_path = "cache-testnet"

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 128
depth = 64
fail_on_revert = false

[profile.ci.fuzz]
runs = 4096

[profile.ci.invariant]
runs = 512
depth = 128

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"

# Etherscan v2: one API key covers all chains, selected by chain id.
[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 11155111 }
base_sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 84532 }

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false
int_types = "long"
