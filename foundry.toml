[profile.default]
# The mainnet denomination ladder; see src/lib/Denominations.sol.
remappings = ["ladder/=ladders/mainnet/"]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
# `Shapes` runtime sits a few KB under the EIP-170 24,576 limit; measure with
# `forge build --sizes`. The recomposition state machine and every configuration write path live
# in the linked `RecompositionOps` and `AdminOps` libraries; see project/ARCHITECTURE.md.
# `optimizer_runs` 1 measured larger on `Shapes` than 20; runtime size does not move monotonically
# with `optimizer_runs`. Re-measure with `forge build --sizes` before changing this value in
# either direction.
optimizer_runs = 20
via_ir = true
bytecode_hash = "none"
cbor_metadata = false
fs_permissions = [{ access = "read", path = "./test/fixtures" }]
gas_reports = ["Shapes", "ShapeRenderer"]
# Reversible compose writes a per-input record, so building a 10,000-origin apex Complete in the
# test fixtures (a single large compose) exceeds forge's 2^30 default. These are logic tests run in
# an inflated-gas environment; mainnet feasibility is a client concern (batch composes to the live
# block gas limit), not a contract limit. See DECOMPOSE_SPEC.md.
gas_limit = "18446744073709551615"
block_gas_limit = 30_000_000_000

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 128
depth = 64
fail_on_revert = false

[profile.ci.fuzz]
runs = 4096

[profile.ci.invariant]
runs = 512
depth = 128

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false
int_types = "long"
