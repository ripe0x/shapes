<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shapes</title>
    <style>
      :root {
        color-scheme: light;
        --page: #f7f7f3;
        --ink: #11110f;
        --body: #2f2f2b;
        --body-dim: #4f4f49;
        --muted: #686862;
        --faint: #aaa9a1;
        --rule: #d8d8d1;
        --rule-inner: #e7e7e1;
        --border: #b9b9b1;
        --row: #efefe9;
        --art: #000000;
      }
      html, body { margin: 0; padding: 0; background: var(--page); }
      * { box-sizing: border-box; }
      body { -webkit-font-smoothing: antialiased; }
      a { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
      a:hover { color: var(--muted); }
      @keyframes artin { from { opacity: 0; } to { opacity: 1; } }
      @keyframes dotpulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
      /* Auction hero row: artwork at 2/3, bid panel at 1/3, stacked below 860px. */
      /* align-items: stretch so the panel column's left-edge rule (its own border-left) always
         spans the full row height, connecting the header's rule above to the row's own bottom
         rule below, regardless of which column's content is taller. */
      .auction-hero { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(320px, 1fr); gap: 40px; align-items: stretch; }
      @media (max-width: 860px) { .auction-hero { grid-template-columns: 1fr; } }
      /* Horizontal padding only: the vertical padding on both columns tracks TOP_MARGIN, a JS
         constant also used to size the artwork, so it stays inline in AuctionView.tsx. */
      .auction-hero-art { padding-left: 48px; }
      .auction-hero-panel { padding-right: 48px; padding-bottom: 36px; padding-left: 26px; }
      .status-dot-live { animation: dotpulse 1.6s ease-in-out infinite; }
      /* Buttons inherit the page font here rather than via an inline `font` shorthand: React
         sets style properties in object key order, so a shorthand can land after an inline
         font-size and silently reset it to 16px. A stylesheet rule always loses to inline
         font-size. */
      button { font: inherit; }
      /* Hover states for the recurring button styles. Inline styles carry everything else. */
      .btn-filled { border: 1px solid var(--ink); background: var(--ink); color: var(--page); font: inherit; font-size: 13px; cursor: pointer; flex: 0 0 auto; white-space: nowrap; }
      .btn-filled:hover { background: transparent; color: var(--ink); }
      .btn-filled:disabled { cursor: default; background: var(--rule); border-color: var(--rule); color: var(--muted); }
      .btn-outline { border: 1px solid var(--border); background: none; color: var(--ink); font: inherit; font-size: 13px; cursor: pointer; flex: 0 0 auto; white-space: nowrap; }
      .btn-outline:hover { border-color: var(--ink); }
      .btn-ghost { border: 0; background: none; padding: 0; font: inherit; cursor: pointer; }
      .account-menu-item { display: block; width: 100%; border: 0; border-bottom: 1px solid var(--rule); background: none; color: var(--ink); padding: 12px 14px; text-align: left; font: inherit; font-size: 11px; letter-spacing: 0.1em; cursor: pointer; white-space: nowrap; }
      .account-menu-item:last-child { border-bottom: 0; }
      .account-menu-item:hover, .account-menu-item:focus-visible { background: var(--row); outline: none; }
      .shape-mode-toggle { display: inline-flex; border: 1px solid var(--border); }
      .shape-mode-toggle button { border: 0; border-right: 1px solid var(--border); background: transparent; color: var(--muted); padding: 8px 12px; font-size: 10px; letter-spacing: .1em; cursor: pointer; }
      .shape-mode-toggle button:last-child { border-right: 0; }
      .shape-mode-toggle button[aria-pressed="true"] { background: var(--ink); color: var(--page); }
      .shape-mode-toggle button:disabled { color: var(--border); cursor: default; }
      .shape-mode-toggle button:not(:disabled):not([aria-pressed="true"]):hover, .shape-mode-toggle button:focus-visible { background: var(--row); color: var(--ink); outline: none; }
      .row-denom:hover { background: var(--row) !important; }
      /* Removes the native up/down spinner so the quantity field reads as a plain boxed number,
         matching the − / + buttons either side of it. */
      .qty-input::-webkit-outer-spin-button, .qty-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
      .qty-input { -moz-appearance: textfield; }
      /* Modal. The overlay dims the page; the panel reuses the section rule colour so it reads
         as the same surface rather than a floating card. */
      .modal-overlay { position: fixed; inset: 0; background: rgba(17,17,15,0.35); display: flex; align-items: center; justify-content: center; padding: 24px; z-index: 50; animation: artin .18s ease both; }
      .modal-panel { background: var(--page); border: 1px solid var(--border); max-width: 480px; width: 100%; padding: 30px 32px 28px; }
      .manage-action-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
      .manage-action-card:not(:disabled):hover { border-color: var(--ink) !important; transform: translateY(-1px); }
      .manage-outcome { display: grid; grid-template-columns: minmax(160px, auto) 36px minmax(0, 1fr); gap: 20px; align-items: center; max-width: 920px; padding: 24px; border: 1px solid var(--rule); background: var(--row); }
      .manage-outcome-arrow { color: var(--muted); font-size: 22px; text-align: center; }
      .shape-token-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 36px 28px; padding: 48px; }
      /* Empty state for a token grid: no Shapes owned, or no Shapes eligible to compose. */
      .shape-grid-empty { padding: 48px; color: var(--muted); font-size: 13px; }
      .compose-select-card { display: block; width: 100%; border: 0; background: none; color: var(--ink); padding: 0; text-align: left; cursor: pointer; }
      .compose-select-card:not(:disabled):hover, .compose-select-card:focus-visible, .compose-survivor-card:not(:disabled):hover, .compose-survivor-card:focus-visible { outline: 1px solid var(--muted); outline-offset: 8px; }
      .compose-select-card.selected, .compose-survivor-card.selected { outline: 1px solid var(--ink); outline-offset: 8px; background: var(--row); }
      .compose-select-card:disabled { cursor: default; opacity: .38; }
      .compose-select-card.selected:disabled { opacity: 1; }
      .compose-selection-badge { position: absolute; top: 8px; right: 8px; padding: 5px 7px; border: 1px solid var(--ink); background: var(--page); color: var(--ink); font-size: 9px; letter-spacing: .08em; }
      .compose-details-link { margin: 8px 10px 0; color: var(--muted); font-size: 10px; letter-spacing: .1em; text-decoration: underline; text-underline-offset: 3px; }
      .compose-selection-tray { position: fixed; z-index: 20; left: 24px; right: 24px; bottom: 18px; display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 14px 18px calc(14px + env(safe-area-inset-bottom)); border: 1px solid var(--ink); background: var(--page); box-shadow: 0 10px 34px rgba(0,0,0,.12); }
      .compose-tray-actions { display: flex; align-items: center; gap: 18px; }
      .compose-survivor-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 160px)); gap: 14px; }
      .compose-survivor-card { border: 1px solid var(--rule); background: none; color: var(--ink); padding: 10px; text-align: left; cursor: pointer; }
      .compose-survivor-card:disabled { cursor: default; }
      .compose-review-outcome { display: grid; grid-template-columns: minmax(180px, 1fr) 36px minmax(180px, 230px); gap: 24px; align-items: center; max-width: 760px; padding: 24px; border: 1px solid var(--rule); background: var(--row); }
      .compose-review-arrow { color: var(--muted); font-size: 22px; text-align: center; }
      .token-trait-row { display: grid; grid-template-columns: minmax(240px, 1.35fr) minmax(130px, 0.65fr); gap: 24px; align-items: start; }
      .token-trait-label { color: var(--body-dim); font-size: 12px; font-weight: 500; line-height: 1.4; }
      .token-trait-description { max-width: 38ch; margin-top: 6px; color: var(--muted); font-size: 10px; line-height: 1.55; }
      .token-trait-value { color: var(--ink); font-size: 14px; line-height: 1.4; }
      /* The page grammar: a two-column section, 190px label column with a right border, content
         column, 1px rule below. `.is-last` drops the rule. Stacks to one column under 700px. */
      .site-section { display: grid; grid-template-columns: 190px minmax(0, 1fr); border-bottom: 1px solid var(--rule); }
      .site-section.is-last { border-bottom: none; }
      .site-section-label { padding: 26px 24px 26px 48px; border-right: 1px solid var(--rule); font-size: 10px; letter-spacing: 0.14em; color: var(--muted); }
      .site-section-content { padding: var(--section-pad, 24px 48px 26px 32px); }
      /* The back-to-token link row above a Shape detail or manage page. */
      .token-detail-back { padding: 20px 48px; border-bottom: 1px solid var(--rule); font-size: 11px; letter-spacing: 0.14em; }
      .site-header { position: sticky; top: 0; z-index: 10; background: var(--page); border-bottom: 1px solid var(--rule); }
      .site-header-inner { display: flex; align-items: center; gap: 32px; width: min(100% - 64px, 1360px); margin-inline: auto; height: 84px; }
      .site-nav-link { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; text-decoration: none; }
      .site-nav-link:hover { opacity: 0.55; }
      .site-connect-btn { display: flex; align-items: center; gap: 9px; max-width: 220px; padding: 8px 14px; border: 1px solid var(--ink); background: var(--ink); color: var(--page); font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; }
      .site-connect-btn:hover { background: transparent; color: var(--ink); }
      .site-footer-outer.site-footer-ruled { border-top: 1px solid var(--rule); }
      .site-footer { width: min(100% - 64px, 1360px); margin-inline: auto; min-height: 110px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px 32px; color: var(--muted); font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; }
      .site-footer a { color: inherit; }
      .site-footer-links { display: flex; align-items: center; gap: 24px; }
      @media (max-width: 620px) {
        .site-header-inner { width: min(100% - 36px, 1360px); height: 70px; }
        .site-footer { width: min(100% - 36px, 1360px); }
      }
      @media (max-width: 700px) {
        .site-header-inner { height: auto !important; min-height: 54px; padding: 12px 20px 0 !important; gap: 12px !important; flex-wrap: wrap; width: 100% !important; margin-inline: 0 !important; }
        .site-nav { order: 3; width: calc(100% + 40px); margin: 0 -20px; padding: 0 20px 12px; gap: 22px !important; overflow-x: auto; scrollbar-width: none; }
        .site-nav > * { flex: 0 0 auto; white-space: nowrap; }
        .site-nav::-webkit-scrollbar { display: none; }
        .site-account { margin-left: auto !important; }
        .site-section { display: block; }
        .site-section-label { border-right: 0; padding: 18px 20px 0; }
        .site-section-content { --section-pad: 14px 20px 28px !important; }
        .token-detail-back { padding: 16px 20px; }
        .token-detail-page .token-detail-hero { gap: 28px !important; }
        .shape-token-grid { padding: 20px; gap: 20px 14px; }
        .shape-grid-empty { padding: 28px 20px; }
        .auction-hero-art { padding-left: 20px; }
        .auction-hero-panel { padding-right: 20px; padding-bottom: 28px; padding-left: 20px; }
        .manage-action-grid { grid-template-columns: 1fr; }
        .manage-outcome { grid-template-columns: 1fr; }
        .manage-outcome-arrow { transform: rotate(90deg); text-align: left; }
        .token-trait-row { grid-template-columns: 1fr; gap: 8px; }
        .token-trait-description { max-width: none; }
        .compose-selection-tray { left: 10px; right: 10px; bottom: 10px; align-items: stretch; flex-direction: column; gap: 12px; }
        .compose-tray-actions { justify-content: space-between; gap: 12px; }
        .compose-review-outcome { grid-template-columns: 1fr; }
        .compose-review-arrow { transform: rotate(90deg); text-align: left; }
      }
      /* Shared with the launch page: kicker label, section rhythm, and tier card grid. */
      .launch-kicker { margin: 0 0 22px; color: var(--muted); font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 10px; font-weight: 500; letter-spacing: 0.13em; line-height: 1.4; text-transform: uppercase; }
      .launch-section { padding-block: clamp(96px, 11vw, 160px); border-bottom: 1px solid var(--rule); }
      .launch-section h2 { margin: 0; font-family: Arial, Helvetica, sans-serif; max-width: 15ch; font-size: clamp(42px, 5.2vw, 78px); font-weight: 500; letter-spacing: -0.06em; line-height: 0.98; }
      .launch-about h2 { max-width: none; font-size: clamp(36px, 4.2vw, 66px); }
      .launch-prose { align-self: end; font-family: Arial, Helvetica, sans-serif; max-width: 650px; font-size: clamp(18px, 1.65vw, 23px); letter-spacing: -0.02em; line-height: 1.5; }
      .launch-prose p { margin: 0; }
      .launch-prose p + p { margin-top: 26px; color: var(--muted); }
      .launch-section-heading { display: flex; align-items: end; justify-content: space-between; gap: 60px; margin-bottom: 62px; }
      .launch-section-heading > p { max-width: 430px; margin: 0; color: var(--muted); font-size: 15px; }
      .tier-grid { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--ink); border-left: 1px solid var(--ink); }
      .tier { min-height: 244px; padding: 25px; border-right: 1px solid var(--ink); border-bottom: 1px solid var(--ink); display: flex; flex-direction: column; position: relative; }
      .tier-value { display: flex; align-items: baseline; gap: 9px; }
      .tier-value strong { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: clamp(32px, 3.4vw, 50px); font-weight: 400; letter-spacing: -0.06em; line-height: 1; }
      .tier-value span, .tier-cost { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; }
      .tier-art { position: absolute; top: 20px; right: 20px; display: block; width: 48px; height: auto; background: #000; border-radius: 3px; }
      .tier-cost { margin: auto 0 0; padding-top: 16px; border-top: 1px solid var(--rule); display: flex; align-items: baseline; justify-content: space-between; gap: 16px; color: var(--muted); text-transform: none; }
      .tier-cost strong { color: var(--ink); font-size: 10px; font-weight: 400; font-variant-numeric: tabular-nums; }
      @media (max-width: 900px) {
        .launch-section-heading { align-items: start; flex-direction: column; }
      }
      @media (max-width: 620px) {
        .launch-section { padding-block: 86px; }
        .launch-section-heading { gap: 34px; margin-bottom: 42px; }
        .tier-grid { grid-template-columns: 1fr; }
        .tier { min-height: 205px; }
        .tier-value strong { font-size: 42px; }
      }
      /* The mint page (/mint): tighter section clamp than the hero landing, and no trailing
         border before the footer. */
      .mint-page .launch-section { padding-block: clamp(56px, 7vw, 96px); }
      .mint-page .launch-about { grid-template-columns: 1fr; }
      .mint-page > .launch-section:last-child { border-bottom: none; }
      /* Mint panel: denomination ladder left, sample art and summary right. Two columns from
         900px up; below that the grid falls back to one column and stacks the ladder above the
         summary, with the grid gap doubling as the stack's vertical spacing. */
      .mint-panel { display: grid; grid-template-columns: minmax(0, 520px) minmax(0, 1fr); gap: clamp(40px, 5vw, 80px); align-items: start; }
      .mint-panel-ladder { min-width: 0; }
      /* Sticky so the summary and mint button stay in view while the ladder scrolls. top: 24px
         clears the viewport edge; .mint-page overrides this below since its header is sticky
         and 84px tall. */
      .mint-panel-side { position: sticky; top: 24px; align-self: start; min-width: 0; }
      .mint-page .mint-panel-side { top: 108px; }
      @media (max-width: 900px) {
        .mint-panel { grid-template-columns: 1fr; }
        .mint-panel-side { position: static; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/site/main.tsx"></script>
  </body>
</html>
